name: Unit Testing & UI Testing

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["main"]

jobs:
    build_and_test:
        runs-on: macos-14

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        
        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        
        - name: Run Tests
          run: |
            xcodebuild test \
            -scheme Bangunin \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            clean test | xcpretty

