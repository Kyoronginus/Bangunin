name: Unit Testing & UI Testing

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["main"]

jobs:
    build_and_test:
        runs-on: macos-15

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Select Xcode 26.2
          run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

        - name: Run Tests
          run: |
            xcodebuild test \
            -scheme Bangunin \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            clean test | xcpretty
