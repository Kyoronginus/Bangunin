name: Unit Testing & UI Testing

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["main"]

jobs:
    build_and_test:
        runs-on: macos-15

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Find and Select Xcode
          run: |
            echo "=== Available Xcode installations ==="
            ls -d /Applications/Xcode*.app || echo "No Xcode found"
            
            echo ""
            echo "=== Current Xcode ==="
            xcode-select -p
            xcodebuild -version
            
            echo ""
            echo "=== Installed SDKs ==="
            xcodebuild -showsdks
            
            echo ""
            echo "=== Installed Platforms ==="
            xcrun simctl runtime list || true

        - name: Install iOS Simulator Runtime
          run: |
            echo "Downloading iOS platform (this may take a few minutes)..."
            xcodebuild -downloadPlatform iOS
            echo "Download complete."
            
            echo ""
            echo "=== Verify simulators are now available ==="
            xcrun simctl list devices available | grep -i "iphone" | head -5

        - name: Run Tests
          run: |
            xcodebuild test \
            -scheme Bangunin \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            clean test | xcpretty
